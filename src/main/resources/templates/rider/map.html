<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="rider-id" th:content="${riderId}">
    <title>Live-Map</title>

    <!-- Meta Tags -->
    <meta name="order-id" th:content="${order != null ? order.id : ''}">
    <meta name="order-status" th:content="${order != null ? order.status : 'READY_TO_PICKUP'}">
    <meta name="customer-lat" th:content="${order != null ? order.latitude : 0}">
    <meta name="customer-lng" th:content="${order != null ? order.longitude : 0}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Leaflet CSS & Routing CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" th:href="@{/css/rider.css}">

    <style>
        #map {
            height: 420px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-routing-container {
            display: none !important;
        }
                /* 💡 Action Button Style */
        .status-btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            transition: background-color 0.3s ease;
        }
        .btn-delivered {
            background-color: #28a745;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="window.history.back();">
        <i class="fa-solid fa-angle-left back"></i>
    </button>

    <div class="map-card">
        <div id="map"></div>
    </div>


    <button id="action-btn" class="status-btn btn-pickup" style="background-color: #28a745;">
        Delivered
    </button>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script th:src="@{/js/rider/rider-map.js}"></script>
</body>

</html>
