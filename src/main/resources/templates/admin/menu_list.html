<!DOCTYPE html>
<html lang="my" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Menu List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #BBE0F2;
        }
    </style>

</head>

<body>

    <div class="edit-status" th:if="${errorMessage}" style="color: red; margin-bottom: 10px;" th:text="${errorMessage}"></div>
    <div class="edit-status" th:if="${successMessage}" style="color: green; margin-bottom: 10px;" th:text="${successMessage}"></div>

    <div class="menu-container">
        <header>
            <h1>Menus</h1>
            <div class="header-right">
                <span class="back-icon" onclick="goToPage('/admin/home')">&times;</span>
                <button class="add-menu-btn" onclick="goToPage('/admin/add_menu')">Add menu</button>
            </div>
        </header>

        <h2>Foods</h2>
        <h5>Total - <span id="food-count" th:text="${foods.size()}">0</span></h5>
        <section class="menu-section" id="foodsection">
            <div class="scroll-container">
                <div class="grid-menu" id="foodGrid">
                    <th:block th:each="food : ${foods}">
                        <div class="menu-item">
                            <div class="img-placeholder"><img th:src="${food.image}" width="100" height="auto"></div>
                            <p class="name" th:text="${food.name}">Bubble Tea</p>
                            <p class="price" th:text="${#numbers.formatInteger(food.price, 0, 'COMMA')} + ' MMK'">price
                            </p>
                            <a id="food-edit" class="edit-btn" th:data-id="${food.id}" th:data-name="${food.name}"
                                th:data-price="${food.price}">
                                <i class="fa-solid fa-edit"></i></a>
                            <a class="delete-btn" th:data-id="${food.id}"><i class="fa-solid fa-trash"></i></a>
                        </div>
                    </th:block>
                </div>
            </div>
        </section>

        <h2>Drinks</h2>
        <h5>Total - <span id="food-count" th:text="${drinks.size()}">0</span></h5>
        <section class="menu-section" id="drinksection">

            <div class="scroll-container">
                <div class="grid-menu" id="drinkGrid">
                    <th:block th:each="drink : ${drinks}">
                        <div class="menu-item">
                            <div class="img-placeholder"><img th:src="${drink.image}" alt="userprofile" width="100"
                                    height="auto" loading="lazy">
                            </div>
                            <p class="name" th:text="${drink.name}">Name</p>
                            <p class="price" th:text="${#numbers.formatInteger(drink.price, 0, 'COMMA')} + ' MMK'">price
                            </p>
                            <a id="drink-edit" class="edit-btn" th:data-id="${drink.id}" th:data-name="${drink.name}"
                                th:data-price="${drink.price}">
                                <i class="fa-solid fa-edit"></i></a>
                            <a class="delete-btn" th:data-id="${drink.id}"><i class="fa-solid fa-trash"></i></a>
                        </div>
                    </th:block>
                </div>
            </div>
        </section>
    </div>


    <div id="modal" class="modal-overlay">
        <form class="modal-box" id="edit-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button id="close-box" class="modal-close" type="button">x</button>
            <label for="fname">Name</label>
            <input type="text" name="fname" id="modal-fname" required>
            <label for="fprice">Price</label>
            <input type="number" name="fprice" id="modal-fprice" required>

            <button type="submit">Change</button>
        </form>
    </div>

    <th:block th:replace="~{includes/admin/partial :: adminJS}"></th:block>
</body>

</html>
